# Run from the repo root with an explicit -f (paths below are relative to docker/):
#   docker compose -f docker/docker-compose.yml up -d           # pull & start
#   docker compose -f docker/docker-compose.yml up -d --build   # build from this checkout
# Credentials come from the repo-root .env (copy .env.example, fill BOT_APPID/BOT_SECRET).
name: qq-bot # resources are qq-bot_* rather than the parent dir's name
services:
  qq-bot:
    image: ghcr.io/isomoes/qq-bot:latest
    # Context is the repo root; Dockerfile + its .dockerignore live in docker/.
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: qq-bot
    env_file:
      - ../.env
    volumes:
      # News SQLite DB (NEWS_DB_PATH, default data/news.db). Named volume, not a
      # bind mount: it inherits the image's node:node (uid 1000) ownership, so the
      # non-root container can write it. A host bind mount takes the host dir's
      # ownership and, if not uid-1000-writable, fails with SQLITE_CANTOPEN.
      - qq-bot-data:/app/data
    init: true # real PID 1: clean SIGTERM shutdown + zombie reaping
    restart: unless-stopped

volumes:
  qq-bot-data:
